name: return_mobile
description: Application mobile ReTurn — restitution sécurisée de documents perdus au Cameroun.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^14.0.2

  # ── Network ───────────────────────────────────────────────────
  dio: ^5.4.3+1

  # ── Modèles & sérialisation ──────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Stockage sécurisé ────────────────────────────────────────
  flutter_secure_storage: ^9.0.0

  # ── Cache offline ────────────────────────────────────────────
  hive_flutter: ^1.1.0

  # ── Firebase ─────────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4

  # ── Icônes ───────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Générateurs de code ───────────────────────────────────────
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  go_router_builder: ^2.7.1

  # ── Lint ──────────────────────────────────────────────────────
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Police Satoshi (à placer dans assets/fonts/)
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
