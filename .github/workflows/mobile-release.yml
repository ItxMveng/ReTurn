name: Mobile · Build APK + Release

# Construit l'APK de production (lié au backend en ligne) et l'attache à une
# Release GitHub. La landing page pointe vers le dernier APK publié ici.
#
# Déclenché par un tag de version :  git tag v1.0.0 && git push origin v1.0.0
# ou manuellement depuis l'onglet Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Autorise le token à créer la Release (contents) ET à déclencher le workflow
# landing (actions) — car un event `release: published` créé par le GITHUB_TOKEN
# ne déclenche PAS d'autre workflow (anti-récursion GitHub). On dispatch donc
# la landing explicitement après la publication.
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: APK release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances Flutter
        run: flutter pub get

      - name: Restaurer la config Firebase (gitignorée, fournie via secrets)
        env:
          FIREBASE_OPTIONS_B64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_B64" ] || [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::error::Secrets FIREBASE_OPTIONS_DART_BASE64 et/ou GOOGLE_SERVICES_JSON_BASE64 manquants."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_B64" | base64 -d > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          echo "✓ firebase_options.dart + google-services.json restaurés."

      # Le code généré (Freezed / Riverpod / json_serializable) est versionné : la génération se bloquait sur les
      # runners GitHub alors qu'elle passe en local. Régénérer en local : dart run build_runner build -d

      - name: Configurer la signature release (keystore depuis les secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Aucun keystore fourni — APK signé avec la clé debug (les MAJ nécessiteront une désinstallation)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (lié au backend en ligne)
        env:
          API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          # --split-per-abi : un APK par architecture (au lieu d'un gros APK
          # universel). L'arm64-v8a couvre ~99% des appareils récents et pèse
          # ~1/3 du poids. On garde aussi l'armeabi-v7a comme repli 32 bits.
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          out=build/app/outputs/flutter-apk
          # return.apk (téléchargement par défaut de la landing) = arm64, léger.
          cp "$out/app-arm64-v8a-release.apk" "$out/return.apk"
          # Repli pour vieux téléphones 32 bits (dispo dans la Release).
          cp "$out/app-armeabi-v7a-release.apk" "$out/ReTurn-32bit.apk"
          ls -lh "$out"/*.apk

      - name: Publier la Release + APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/return.apk
            mobile/build/app/outputs/flutter-apk/ReTurn-32bit.apk
          name: ReTurn ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Redéploie la landing avec le nouvel APK. Indispensable : sans ce dispatch
      # explicite, la landing ne se met jamais à jour après un build CI.
      - name: Redéployer la landing (nouvel APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run landing.yml --ref main
