name: Landing · Déploiement GitHub Pages

# Publie la landing page (téléchargement de l'APK) sur GitHub Pages à chaque
# modification du dossier landing/.
on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "admin/**"
      - ".github/workflows/landing.yml"
  # Republie la page (avec le nouvel APK) dès qu'une Release est publiée.
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read      # lecture des assets de Release (dépôt privé)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Dépôt privé : on télécharge l'APK de la dernière Release avec le token
      # (les assets d'un dépôt privé ne sont pas accessibles sans auth) et on le
      # place dans landing/ pour qu'il soit servi publiquement via GitHub Pages.
      - name: Récupérer le dernier APK de la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern "return.apk" --dir landing --clobber; then
            echo "✓ APK ajouté à la page (landing/return.apk)."
          else
            echo "::warning::Aucune Release APK trouvée — la page sera publiée sans le fichier (le bouton renverra une 404 jusqu'à la 1re release)."
          fi

      # Héberge aussi le panneau d'administration sous /admin (auth API requise).
      - name: Inclure le panel admin
        run: |
          mkdir -p landing/admin
          cp -r admin/* landing/admin/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
