services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: docretour_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docretour_network

  redis:
    image: redis:7-alpine
    container_name: docretour_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docretour_network

  minio:
    image: minio/minio:latest
    container_name: docretour_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - docretour_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docretour_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MINIO_PUBLIC_URL=http://192.168.1.99:9000
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docretour_network

volumes:
  postgres_data:
    name: docretour_postgres_data
  redis_data:
    name: docretour_redis_data
  minio_data:
    name: docretour_minio_data

networks:
  docretour_network:
    name: docretour_network
    driver: bridge
